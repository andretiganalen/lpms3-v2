"settings.attachments.whitelist_text_html": "Tentukan daftar ekstensi berkas dan/atau tipe mime yang valid untuk berkas yang diunggah. <br/> Masukkan ekstensi berkas (mis., <code>%{ext_example}</code>) atau tipe mime (mis., <code>%{mime_example}</code>). <br/> Biarkan kosong untuk mengizinkan semua tipe berkas diunggah. Beberapa nilai diizinkan (satu baris untuk setiap nilai).\n"
"settings.authentication.omniauth_direct_login_hint_html": "Jika opsi ini aktif, permintaan login akan dialihkan ke penyedia omniauth yang dikonfigurasi. Dropdown login dan halaman masuk akan dinonaktifkan. <br/> <strong>Catatan:</strong> Kecuali Anda juga menonaktifkan login kata sandi, dengan opsi ini aktif pengguna tetap dapat login secara internal dengan mengunjungi halaman login <code>%{internal_path}</code>.\n"
"settings.authentication.password_login_bypass_principal_ids_hint": "Meskipun login kata sandi dinonaktifkan, pengguna dan grup ini tetap dapat menggunakan kata sandi mereka untuk masuk. Hal ini berguna, misalnya, jika penyedia identitas tidak tersedia. Jika Anda menyertakan grup, akses akan diperluas ke semua pengguna dalam grup tersebut.\n"
"settings.authentication.password_login_configured_by_environment": "Pengaturan berikut dikonfigurasi melalui lingkungan dan tidak dapat diubah di sini:\n"
"settings.authentication.password_login_requires_sso_provider": "Pembatasan login kata sandi tidak tersedia karena saat ini tidak ada penyedia SSO yang diaktifkan. Konfigurasikan dan aktifkan penyedia SSO sebelum mengubah pengaturan ini.\n"
"settings.authentication.remapping_existing_users_hint": "Jika diaktifkan, mengizinkan penyedia identitas apa pun yang dikonfigurasi untuk melakukan login pengguna yang sudah ada berdasarkan nama pengguna mereka, meskipun pengguna tersebut belum pernah masuk melalui penyedia itu sebelumnya. Hal ini berguna saat memigrasikan instans LPMS ke penyedia SSO baru, tetapi tidak disarankan jika menggunakan penyedia yang tidak dipercaya oleh semua pengguna instans Anda.\n"
"settings.date_format.first_date_of_week_and_year_set": "Jika salah satu opsi \"%{day_of_week_setting_name}\" atau \"%{first_week_setting_name}\" ditetapkan, opsi lainnya juga harus ditetapkan untuk menghindari inkonsistensi di frontend.\n"
"settings.date_format.first_week_of_year_text_html": "Pilih tanggal di bulan Januari yang termasuk dalam minggu pertama tahun tersebut. Nilai ini bersama dengan hari pertama dalam seminggu menentukan jumlah total minggu dalam setahun. Untuk informasi lebih lanjut, silakan lihat <a href=\"%{link}\" target=\"_blank\">dokumentasi</a> kami mengenai topik ini.\n"
