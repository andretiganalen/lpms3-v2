"ldap_groups.synchronized_groups.help_text_html": "Modul ini memungkinkan Anda menyiapkan sinkronisasi antara grup LDAP dan LPMS. <br/> Secara default, LPMS menggunakan <strong>reverse lookup</strong>: mencari pengguna yang atribut <em>memberOf</em>-nya cocok dengan DN grup. Hal ini mengharuskan atribut <em>memberOf</em> ada pada entri pengguna (Active Directory, OpenLDAP dengan overlay memberof). <br/> Jika server LDAP Anda tidak mengelola <em>memberOf</em> pada entri pengguna (mis. menggunakan <em>groupOfUniqueNames</em> dengan <em>uniqueMember</em>), Anda dapat mengonfigurasi <strong>forward lookup</strong> dengan mengatur <em>Atribut anggota grup</em> pada filter sinkronisasi. <br/> Grup disinkronkan setiap jam melalui cron job. [Silakan lihat dokumentasi kami mengenai topik ini](docs_url)."
