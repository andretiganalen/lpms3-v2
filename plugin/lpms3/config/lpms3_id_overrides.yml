"permission_allocate_user_resources_explanation": "Memungkinkan pengguna membuat, memperbarui, dan menghapus alokasi sumber daya dalam perencana sumber daya. Ini mencakup penugasan pengguna (atau filter pengguna) ke perencana serta penyesuaian waktu dan rentang tanggal yang dialokasikan."
