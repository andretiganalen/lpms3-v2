"permission_view_resource_planners": "Melihat perencana sumber daya"
"permission_view_resource_planners_explanation": "Memungkinkan pengguna mengakses perencana sumber daya. Pengguna dapat membuat dan mengelola perencana sumber daya miliknya sendiri serta melihat perencana sumber daya publik. Tidak memungkinkan pengguna melihat perencana sumber daya buatan pengguna lain yang tidak dibagikan secara publik."
