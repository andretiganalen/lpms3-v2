"text_github_comment_user_info": "Pengguna LPMS yang kunci API-nya harus digunakan untuk mengautentikasi permintaan webhook masuk. Jika diatur, permintaan yang diautentikasi dengan kredensial pengguna lain akan ditolak. Pengguna ini juga memposting komentar status deployment otomatis pada paket-penugasan. Bawaannya adalah pengguna sistem jika tidak diatur."
