"ldap_departments.synchronized_trees.help_text": "Modul ini mencerminkan struktur unit organisasi (OU) direktori LDAP Anda ke hierarki departemen LPMS. Setiap OU di bawah base DN yang dikonfigurasi menjadi sebuah departemen, dan pengguna ditetapkan ke departemen dari OU tempat mereka berada. Departemen disinkronkan secara berkala melalui cron job."
