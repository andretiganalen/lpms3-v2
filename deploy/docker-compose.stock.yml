# LPMS3 · override untuk OpenProject resmi + plugin LPMS3. Landing :5100 (IdsLogin): Login User dan Login Admin, keduanya via IDS.
x-ids-env: &ids
  OPENPROJECT_OPENID__CONNECT_IDS_DISPLAY__NAME: "IDS Len"
  OPENPROJECT_OPENID__CONNECT_IDS_IDENTIFIER: "${IDS_CLIENT_ID}"
  OPENPROJECT_OPENID__CONNECT_IDS_SECRET: "${IDS_CLIENT_SECRET}"
  OPENPROJECT_OPENID__CONNECT_IDS_ISSUER: "https://dev-ids-intern.len.co.id/"
  OPENPROJECT_OPENID__CONNECT_IDS_AUTHORIZATION__ENDPOINT: "https://dev-ids-intern.len.co.id/connect/authorize"
  OPENPROJECT_OPENID__CONNECT_IDS_TOKEN__ENDPOINT: "https://dev-ids-intern.len.co.id/connect/token"
  OPENPROJECT_OPENID__CONNECT_IDS_USERINFO__ENDPOINT: "https://dev-ids-intern.len.co.id/connect/userinfo"
  OPENPROJECT_OPENID__CONNECT_IDS_END__SESSION__ENDPOINT: "https://dev-ids-intern.len.co.id/connect/endsession"
  OPENPROJECT_OPENID__CONNECT_IDS_JWKS__URI: "https://dev-ids-intern.len.co.id/.well-known/openid-configuration/jwks"
  OPENPROJECT_OPENID__CONNECT_IDS_SCOPE: "openid profile email"
  OPENPROJECT_OPENID__CONNECT_IDS_ATTRIBUTE__MAP_LOGIN: "email"
  OPENPROJECT_OPENID__CONNECT_IDS_ATTRIBUTE__MAP_EMAIL: "email"
  OPENPROJECT_OPENID__CONNECT_IDS_ATTRIBUTE__MAP_FIRST__NAME: "given_name"
  OPENPROJECT_OPENID__CONNECT_IDS_ATTRIBUTE__MAP_LAST__NAME: "family_name"
# Image OpenProject + plugin LPMS3 (dibangun oleh ops/build_image.sh dari deploy/Dockerfile).
x-lpms3-op: &lpms3op
  image: lpms3/openproject:${LPMS3_IMAGE_TAG:-local}
services:
  web:      { <<: *lpms3op, environment: *ids }
  worker:   { <<: *lpms3op, environment: *ids }
  cron:     { <<: *lpms3op, environment: *ids }
  seeder:   { <<: *lpms3op, environment: *ids }
  lpms3-data:
    build: { context: ../etl }
    image: lpms3/data:local
    restart: unless-stopped
    environment:
      PG_DSN: "postgresql://postgres:${LPMS3_PG_PASSWORD}@db:5432/openproject"
      STARROCKS_HOST: "${STARROCKS_HOST}"
      STARROCKS_PORT: "${STARROCKS_PORT}"
      STARROCKS_DATABASE: "${STARROCKS_DATABASE}"
      STARROCKS_USER: lpms3_etl
      STARROCKS_PASSWORD: "${STARROCKS_ETL_PASSWORD}"
    depends_on: [db]
    networks: [backend]
  idslogin:
    build: { context: ../src/Lpms3.IdsLogin }
    image: lpms3-idslogin:local
    restart: unless-stopped
    environment:
      Oidc__ClientId: "${IDS_CLIENT_ID}"
      Oidc__ClientSecret: "${IDS_CLIENT_SECRET}"
      Oidc__Authority: "https://dev-ids-intern.len.co.id"
      OpenProject__BaseUrl: "http://web:8080"
      OpenProject__PublicHost: "${OPENPROJECT_HOST__NAME}"
      OpenProject__BridgeApiKey: "${LPMS3_BRIDGE_API_KEY}"
      AdminRoles: "${IDS_ADMIN_ROLES:-admin,administrator}"
      AdminEmails: "${IDS_ADMIN_EMAILS:-}"
    volumes:
      - ../data/idslogin-keys:/keys
    networks: [frontend]
  proxy:
    volumes:
      - ../deploy/Caddyfile.landing:/etc/caddy/Caddyfile:ro
    depends_on: [web, idslogin]
